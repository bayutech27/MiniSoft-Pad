<!DOCTYPE html>

<head>

  <title>MiniSoft Pad | Write To-do</title>

<body>

  <main class="dashboard">

    <!-- HEADER -->
    <header class="dashboard-header">

        <h1 class="header-text">MiniSoft Pad</h1>

        <nav class="back-to-dash"><a href="dashboard.html">Back to Dashboard</a></nav>
    </header>
    
    <div class="create-task">
        <h3>Create Task</h3>

    <div class="add-task">
        <input type="text" id="task" autofocus placeholder="eg: Meeting with the MD" required>
        <button class="add-btn">Add</button>
    </div>
    </div>
    <section class="content-section">

      <div class="add-new">
      <h2 class="section-title2">To-Do List</h2>
     </div>
     <hr class="horizontal-rule2">

    


    <ul id="todoContainer" class="todo-container"></ul>
    
  <div class="back-to-top">
    <a href="#"><p>Back to top</p></a>
   </div>

  </main>
