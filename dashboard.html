<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="author" content="Bayo Alabi">

  <title>MiniSoft Pad | Dashboard</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="css/dashboard.css">
   <link rel="stylesheet" href="css/mobile.css">
</head>
<body>

  <main class="dashboard">

    <!-- HEADER -->
    <header class="dashboard-header">

        <h1 class="header-text">MiniSoft Pad</h1>

      <button id="logOutBtn" class="btn btn-outline">Logout</button>
    </header>

    <section class="welcome-section">
         <div>
       <h2 class="welcome-text" id="welcomeUser">Welcome!</h2>

        <p class="subtitle">Manage your notes and to-do list easily.</p>
      </div>
    </section>

    <!-- ACTION BUTTONS -->
    <section class="quick-actions">

      <button id="addNoteBtn" class="btn btn-primary"><a href="writenote.html"><i class="fa-solid fa-pen-to-square"></i>&nbsp;&nbsp;Write Note</a></button>
      <button id="addTodoBtn" class="btn btn-secondary"><a href="writetodo.html"><i class="fa-solid fa-clipboard-list"></i>&nbsp;&nbsp;To-Do List</a></button>
    </section>

    <!-- NOTES SECTION -->
    <section class="content-section">
      <div class="add-new">
        <h2 class="section-title1">My Notes</h2>
        <a href="writenote.html"><i id="add-icon1"  class="fa-solid fa-plus"></i></a>
            </div>
            <hr class="horizontal-rule1">

      <ul id="notesContainer"></ul>

      <div class="more-note">
          <a href="noteslist.html"><button>More Notes</button></a>
      </div>

    </section>

    <!-- TODO SECTION -->
    <section class="content-section">
    <div class="add-new">
      <h2 class="section-title2">My To-Do List</h2>
      <a href="writetodo.html"><i id="add-icon2" class="fa-solid fa-plus"></i></a>
     </div>
     <hr class="horizontal-rule2">



      <ul id="todoContainer" class="todo-container"></ul>

      

      <div class="more-list">
        <a href="writetodo.html"><button>Create More Task</button></a>
    </div>
    </section>

     <div class="back-to-top">
    <a href="#"><p>Back to top</p></a>
   </div>



    <script type="module" src="js/auth.js"></script>
    
    <script type="module" src="js/dashboard.js"></script>
    <script type="module" src="js/writetodo.js"></script>


  </main>

  <footer>
    &copy; MiniSoft Pad. All rights reserved.
  </footer>
</body>
</html>
